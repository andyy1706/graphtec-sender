<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Graphtec Sender</title>
  <rect width="256" height="256" rx="56" fill="#2563eb"/>
  <!-- geschnittener Weg -->
  <path d="M36 192 C 70 192, 76 150, 112 150" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <!-- noch zu schneiden -->
  <path d="M112 150 C 150 150, 170 196, 218 196" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 20"/>
  <!-- Messerhalter mit 45°-Klinge, Spitze auf dem Schnitt -->
  <g transform="translate(112 150) rotate(45)">
    <path d="M0 0 L-9 -12 L-9 -36 L9 -36 L9 -18 Z" fill="#e2e8f0"/>
    <rect x="-22" y="-52" width="44" height="18" rx="5" fill="#fff"/>
    <rect x="-17" y="-128" width="34" height="80" rx="9" fill="#fff"/>
  </g>
</svg>
